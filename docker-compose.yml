services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: qa_training
      POSTGRES_USER: qa_user
      POSTGRES_PASSWORD: qa_password
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qa_user -d qa_training"]
      interval: 5s
      timeout: 3s
      retries: 10
