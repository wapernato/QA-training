spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/qa_training}
    username: ${DB_USERNAME:qa_user}
    password: ${DB_PASSWORD:qa_password}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
app:
  jwt:
    secret: ${JWT_SECRET:change-this-secret-in-production-please}
    expiration-minutes: 60
springdoc:
  swagger-ui:
    path: /swagger-ui.html
